services:
  # Backend API Service
  - type: web
    name: khetgpt-backend
    env: python
    region: oregon
    plan: standard
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: qwen/qwen3.8-27b
      - key: DATABASE_URL
        value: sqlite:///./data/db/khetgpt.db
      - key: CHROMA_PERSIST_DIR
        value: ./data/chroma_db
      - key: CORS_ORIGINS
        value: "*"
    disk:
      name: khetgpt-data
      mountPath: /opt/render/project/src/data
      sizeGB: 10

  # Frontend Web Service
  - type: web
    name: khetgpt-frontend
    env: static
    region: oregon
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://khetgpt-backend.onrender.com

